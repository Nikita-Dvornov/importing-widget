<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products and countries</title>
<script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
<style>
  :root { --line:#e1e4e8; --muted:#6b7280; --accent:#0a4b78; --bad:#b3261e; }
  body { font:14px/1.5 "Philosopher",-apple-system,Segoe UI,Roboto,sans-serif; margin:0; color:#1f2328; }
  .device { border:1px solid var(--line); border-radius:8px; margin-bottom:10px; }
  .device.on { border-color:var(--accent); }
  .head { display:flex; align-items:center; gap:11px; padding:11px 13px; background:#fafbfc; cursor:pointer;
          border-radius:7px 7px 0 0; transition:background .12s; }
  .head:hover { background:#f3f5f7; }
  .device.on .head { background:#eef4f9; }
  .head > input[type=checkbox] { width:17px; height:17px; margin:0; flex:0 0 auto; accent-color:var(--accent); }
  .titles { display:flex; flex-direction:column; min-width:0; flex:1; }
  .code { font-weight:600; }
  .sub { color:var(--muted); font-size:12.5px; }
  .pill { margin-left:auto; font-size:11.5px; color:var(--accent); background:#e8f0f7; border-radius:20px;
          padding:3px 10px; white-space:nowrap; }
  .body { display:none; padding:2px 13px 13px; }
  .device.on .body { display:block; }
  .lbl { font-size:12px; color:var(--muted); margin:10px 0 5px; }
  .countries { display:flex; flex-wrap:wrap; gap:6px 14px; }
  .country { display:flex; align-items:center; gap:6px; font-size:13px; }
  .country input { accent-color:var(--accent); }
  .links { margin-top:6px; font-size:12px; }
  .links a { color:var(--accent); text-decoration:underline; cursor:pointer; margin-right:12px; }
  .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px 11px; margin-top:12px;
          border-top:1px solid var(--line); padding-top:12px; }
  .f { display:flex; flex-direction:column; gap:3px; }
  .f.wide { grid-column:1 / -1; }
  .f span { font-size:11.5px; color:var(--muted); }
  .f span b { color:var(--bad); font-weight:400; }
  input[type=text], textarea { font:13px inherit; padding:6px 7px; border:1px solid #ccd0d5; border-radius:5px;
                     width:100%; box-sizing:border-box; }
  textarea { min-height:64px; resize:vertical; line-height:1.4; font-family:inherit; overflow:hidden; }
  input.miss, textarea.miss { border-color:var(--bad); background:#fff7f7; }
  .warn { background:#fff6e5; border:1px solid #f0c36d; border-radius:8px; padding:10px 12px; font-size:13px; }
  .diag { margin-top:10px; padding:8px 10px; background:#f5f6f8; border:1px solid var(--line); border-radius:6px;
          font:11px/1.4 ui-monospace,Menlo,monospace; color:#444; word-break:break-all; }
  .err { color:var(--bad); font-size:12.5px; margin-top:9px; display:none; }
  .device.bad .err { display:block; }
  .summary { font-size:12.5px; color:var(--muted); margin-top:10px; }
</style>
</head>
<body>
<div id="root"></div>

<script>
(function () {
  var FIELDS = [
    { k:"name",      label:"Product Name (per B-UDI-DI)", req:true },
    { k:"articleNo", label:"Article No (Ref / Cat. No)",  req:true },
    { k:"udi",       label:"UDI-DI / UDI-PI (one per line if several)", req:true, wide:true, long:true },
    { k:"lot",       label:"Lot No.",                     req:true },
    { k:"shelfLife", label:"Shelf Life (if applicable)",  req:false },
    { k:"qty",       label:"Total Order Quantity",        req:true }
  ];

  var catalog = [], state = {}, lastRaw = "", readyData = null;
  var root = document.getElementById("root");

  function fit(){ try{ JFCustomWidget.requestFrameResize({height:document.body.scrollHeight+25}); }catch(e){} }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]; }); }

  // Stored value is plain delimited text, NOT JSON: JotFlow turns any JSON-looking value into an HTML table in
  // which nested lists become the word "Array". One record per " ;; ", fields split by "|":
  //   C|code|name|AT,DE,...                                          catalog entry (devices + allowed countries)
  //   S|code|AT,DE|name|articleNo|udi|lot|shelfLife|qty              a device that is part of this shipment
  // The prefill link still carries JSON (a URL parameter is not touched by JotFlow), so decode() accepts both.
  // A long field (UDI-DI / UDI-PI) may hold several lines; each line break is stored as "; " and turned back into
  // a line break when a saved submission is reopened, so the stored format stays one line per record.
  var REC = " ;; ", LINE = "; ";
  function clean(s){ return String(s==null?"":s).replace(/\|/g,"/").replace(/\s*[\r\n]+\s*/g,LINE).replace(/;;+/g,";").trim(); }
  function unlines(s){ return String(s==null?"":s).split(LINE).join("\n"); }
  function encodeValue(v) {
    var rows = [];
    v.catalog.forEach(function(d){ rows.push(["C", clean(d.code), clean(d.name), d.countries.join(",")].join("|")); });
    v.selected.forEach(function(d){
      rows.push(["S", clean(d.code), d.countries.join(","), clean(d.name), clean(d.articleNo), clean(d.udi),
                 clean(d.lot), clean(d.shelfLife), clean(d.qty)].join("|"));
    });
    return rows.join(REC);
  }
  function decodeText(s) {
    var out = { catalog: [], selected: [] };
    s.split(REC).forEach(function(r){
      var p = r.split("|"), cs = function(x){ return x ? x.split(",").filter(Boolean) : []; };
      if (p[0] === "C") out.catalog.push({ code:p[1], name:p[2], countries:cs(p[3]) });
      else if (p[0] === "S") out.selected.push({ code:p[1], countries:cs(p[2]), name:p[3], articleNo:p[4],
                                                 udi:p[5], lot:p[6], shelfLife:p[7], qty:p[8] });
    });
    return out;
  }

  function decode(raw) {
    lastRaw = (raw==null) ? "" : String(raw);
    if (!raw) return null;
    if (typeof raw !== "string") return raw;
    var s = raw.trim().replace(/&quot;/g,'"').replace(/&#34;/g,'"').replace(/&#39;/g,"'")
               .replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&");
    if (/^[CS]\|/.test(s)) return decodeText(s);
    var tries = [s];
    if (/%5B|%7B|%22/i.test(s)) { try { tries.push(decodeURIComponent(s)); } catch(e){} }
    for (var i=0;i<tries.length;i++){ try { return JSON.parse(tries[i]); } catch(e){} }
    return null;
  }

  function blank(){ var o={}; FIELDS.forEach(function(f){ o[f.k]=""; }); return o; }

  function load(raw) {
    var data = decode(raw);
    if (!data) return;
    // Either a bare catalog array (first load, from the link) or {catalog, selected} (saved submission)
    var cat = Array.isArray(data) ? data : (data.catalog || []);
    catalog = cat.map(function(d){
      return {
        code: String(d.code || d.budidi || "").trim(),
        name: String(d.name || "").trim(),
        countries: (d.countries||[]).map(function(c){
          return (typeof c === "string") ? {code:c,label:c} : {code:c.code,label:c.label||c.code}; })
      };
    }).filter(function(d){ return d.code; });

    catalog.forEach(function(d){ state[d.code] = { on:false, countries:new Set(), data:blank() }; });

    (data.selected||[]).forEach(function(sel){
      var st = state[sel.code]; if (!st) return;
      st.on = true;
      st.countries = new Set(sel.countries||[]);
      FIELDS.forEach(function(f){ if (sel[f.k] != null) st.data[f.k] = f.long ? unlines(sel[f.k]) : sel[f.k]; });
    });
  }

  function value() {
    return {
      catalog: catalog.map(function(d){
        return { code:d.code, name:d.name, countries:d.countries.map(function(c){ return c.code; }) }; }),
      selected: catalog.filter(function(d){ return state[d.code].on; }).map(function(d){
        var st = state[d.code], out = { code:d.code, countries:Array.from(st.countries) };
        FIELDS.forEach(function(f){ out[f.k] = st.data[f.k]; });
        return out;
      })
    };
  }

  function push() {
    try { JFCustomWidget.sendData({ value: encodeValue(value()) }); } catch(e){}
    var n = value().selected.length;
    var el = document.getElementById("summary");
    if (el) el.textContent = n ? n + " product(s) in this shipment" : "No products selected yet.";
  }

  function render() {
    if (!catalog.length) {
      root.innerHTML = '<div class="warn"><b>No products found for your account.</b><br>' +
        'Please open this form using the personalised link we emailed you. ' +
        'If you reached it another way, contact regulatory@growthimports.eu.</div>' +
        '<div class="diag"><b>Diagnostic</b><br>value: ' +
        (lastRaw ? lastRaw.length + ' chars → ' + esc(lastRaw.slice(0,200)) : '<b>none received</b>') +
        '<br><br>ready payload: ' + esc(JSON.stringify(readyData).slice(0,300)) + '</div>';
      fit(); return;
    }
    root.innerHTML = catalog.map(function(d,i){
      var st = state[d.code];
      return '<div class="device'+(st.on?" on":"")+'" id="d'+i+'">' +
        '<label class="head"><input type="checkbox" data-dev="'+i+'" data-sel="1"'+(st.on?" checked":"")+'>' +
          '<span class="titles"><span class="code">'+esc(d.code)+'</span>' +
          '<span class="sub">'+esc(d.name || (d.countries.length+' market(s) registered'))+'</span></span>' +
          (st.on ? '<span class="pill">'+st.countries.size+' of '+d.countries.length+' countries</span>' : '') +
        '</label>' +
        '<div class="body">' +
          '<div class="lbl">Countries where these devices will be made available:</div>' +
          '<div class="countries">' + d.countries.map(function(c,j){
             return '<label class="country"><input type="checkbox" data-dev="'+i+'" data-c="'+j+'"'+
                    (st.countries.has(c.code)?" checked":"")+'>'+esc(c.label)+'</label>'; }).join("") +
          '</div>' +
          '<div class="links"><a data-all="'+i+'">Select all</a><a data-none="'+i+'">Clear</a></div>' +
          '<div class="grid">' + FIELDS.map(function(f){
             return '<div class="f'+(f.wide?" wide":"")+'"><span>'+esc(f.label)+(f.req?' <b>*</b>':'')+'</span>' +
               (f.long ? '<textarea rows="3" data-dev="'+i+'" data-k="'+f.k+'">'+esc(st.data[f.k])+'</textarea>'
                       : '<input type="text" data-dev="'+i+'" data-k="'+f.k+'" value="'+esc(st.data[f.k])+'">') + '</div>';
          }).join("") + '</div>' +
          '<div class="err">Select at least one country and complete every field marked *.</div>' +
        '</div></div>';
    }).join("") + '<div class="summary" id="summary"></div>';
    Array.prototype.forEach.call(root.querySelectorAll("textarea"), grow);
    push(); fit();
  }

  // Grow a long field with its text so nothing hides behind a scrollbar inside the form's iframe.
  function grow(t){ if (!t.offsetParent) return; t.style.height = "auto"; t.style.height = (t.scrollHeight + 2) + "px"; }

  root.addEventListener("change", function(e){
    var t=e.target; if (t.tagName!=="INPUT") return;
    var i=+t.getAttribute("data-dev"); if (isNaN(i)) return;
    var st=state[catalog[i].code];
    if (t.hasAttribute("data-sel")) { st.on=t.checked; render(); return; }
    if (t.hasAttribute("data-c")) {
      var code=catalog[i].countries[+t.getAttribute("data-c")].code;
      t.checked ? st.countries.add(code) : st.countries.delete(code);
      render(); return;
    }
  });

  root.addEventListener("input", function(e){
    var t=e.target;
    if ((t.tagName==="INPUT" || t.tagName==="TEXTAREA") && t.hasAttribute("data-k")) {
      var i=+t.getAttribute("data-dev");
      state[catalog[i].code].data[t.getAttribute("data-k")] = t.value;
      t.classList.remove("miss");
      var el=document.getElementById("d"+i); if (el) el.classList.remove("bad");
      if (t.tagName==="TEXTAREA") { grow(t); fit(); }
      push();
    }
  });

  root.addEventListener("click", function(e){
    var g=function(a){ return e.target.getAttribute && e.target.getAttribute(a); };
    var all=g("data-all"), none=g("data-none");
    if (all!=null) toggleAll(+all,true);
    else if (none!=null) toggleAll(+none,false);
  });

  function toggleAll(i,on){
    var d=catalog[i], st=state[d.code];
    d.countries.forEach(function(c){ on ? st.countries.add(c.code) : st.countries.delete(c.code); });
    render();
  }

  JFCustomWidget.subscribe("ready", function(data){
    readyData = data;
    load(data && (data.value!==undefined ? data.value : data.defaultValue));
    render();
  });

  JFCustomWidget.subscribe("submit", function(){
    var v=value(), bad=false;
    catalog.forEach(function(d,i){
      var st=state[d.code]; if (!st.on) return;
      var problem = st.countries.size===0;
      FIELDS.forEach(function(f){
        if (!f.req) return;
        if (!String(st.data[f.k]||"").trim()) {
          problem=true;
          var box=root.querySelector('[data-dev="'+i+'"][data-k="'+f.k+'"]');
          if (box) box.classList.add("miss");
        }
      });
      var el=document.getElementById("d"+i);
      if (el) el.classList.toggle("bad", problem);
      if (problem) bad=true;
    });
    if (bad || !v.selected.length) { fit(); JFCustomWidget.sendSubmit({valid:false, value:""}); return; }
    JFCustomWidget.sendSubmit({ valid:true, value: encodeValue(v) });
  });
})();
</script>
</body>
</html>
